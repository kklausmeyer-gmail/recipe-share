# Supabase pauses free projects after a week without activity.
# This pings the database twice a week so the recipe box never goes to sleep.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          set -a; source .env.production; set +a
          if [ -z "$VITE_SUPABASE_URL" ]; then echo "Not configured yet"; exit 0; fi
          curl -fsS "$VITE_SUPABASE_URL/rest/v1/tags?select=name&limit=1" \
            -H "apikey: $VITE_SUPABASE_PUBLISHABLE_KEY" -o /dev/null -w "HTTP %{http_code}\n"
